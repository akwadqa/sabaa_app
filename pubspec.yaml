name: sabaa
description: "🚚 Field Sales & Delivery Management App that helps teams manage orders, customers, and deliveries in the field. Users can create orders, connect with supermarkets, track inventory, and handle deliveries efficiently. Supports multiple roles including 🚐 Vansell, 🧑‍💼 Salesman, and 🚛 Driver for streamlined operations."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  get_it: ^9.2.1
  equatable: ^2.0.8
  dartz: ^0.10.1
  flutter_riverpod: ^3.2.1
  json_annotation: ^4.8.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  go_router: ^14.4.1
  pretty_dio_logger: ^1.3.1
  permission_handler: ^11.1.0
  colorize: ^3.0.0
  easy_localization: ^3.0.6
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.1.0
  bot_toast: ^4.1.3
  path_provider: ^2.1.5
  flutter_svg: ^2.0.14
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  device_preview: ^1.3.1
  animated_bottom_navigation_bar: ^1.4.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  fcm_config: ^3.6.5
  firebase_analytics: ^12.1.1  
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.0.2
  intl_phone_field: ^3.2.0
  queen_validators: ^1.0.1
  image_picker: ^1.2.1
  toastification: ^3.2.0
  dropdown_button2: ^2.3.9
  slider_button: ^3.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # analyzer: ^9.0.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.1
  build_runner: ^2.4.13
  riverpod_lint: ^3.1.1
  # auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.8.0
  freezed: ^3.2.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/lottie/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

flutter_gen:
  integrations:
    flutter_svg: true
flutter_intl:
  enabled: true